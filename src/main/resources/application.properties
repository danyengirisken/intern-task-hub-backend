# ====================================================================
#  Intern Task Hub - Ortak ayarlar (carbon konvansiyonu)
#  Profil; Maven 'activatedProperties' degeri ile build sirasinda gelir.
#  Ortama ozel ayarlar : application-<profil>.properties
#  Veritabani ayarlari : database-<profil>.properties
# ====================================================================
spring.application.name=interntaskhub

spring.profiles.active=@activatedProperties@
spring.liquibase.contexts=@activatedProperties@

# --- DataSource (ortak surucu/dialect; baglanti database-<profil>.properties'te) ---
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- JPA / Hibernate ---
# Tablolari Hibernate DEGIL Liquibase olusturur; Hibernate yalnizca dogrular.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/liquibase/interntaskhub-changelog.xml

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- JWT ---
app.jwt.secret=intern-task-hub-development-secret-key-change-me-1234567890
app.jwt.expiration-ms=86400000
